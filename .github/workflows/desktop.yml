name: Build desktop packages
on:
  workflow_dispatch:
jobs:
  package:
    strategy:
      matrix:
        include:
          - os: macos-15
            script: package:mac
            artifact: mac-arm64
          - os: windows-latest
            script: package:win
            artifact: win-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - if: runner.os == 'macOS'
        run: brew install libredwg
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Tongzhou-${{ matrix.artifact }}
          path: |
            app/release/*.dmg
            app/release/*.zip
            app/release/*.exe
            app/release/*.blockmap
# Build verification only. Native interactive login/installation/business acceptance
# still requires the separate checklist in app/DESKTOP-ACCEPTANCE.md.
