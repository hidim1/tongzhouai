appId: cn.tongzhou.engineering.ai
productName: 舟知
copyright: 舟知工程工作台
asar: true
npmRebuild: false
artifactName: Zhouzhi-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: desktop/assets
files:
  - dist/**/*
  - server/**/*
  - scripts/seed.mjs
  - .agents/skills/**/*
  - desktop/main.cjs
  - desktop/provider-vault.cjs
  - package.json
  - '!data{,/**/*}'
  - '!desktop/resources{,/**/*}'
  - '!**/*.map'
extraResources:
  - from: desktop/resources/${os}-${arch}
    to: runtime
mac:
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.productivity
  icon: desktop/assets/icon.icns
  identity: null
  hardenedRuntime: true
  extendInfo:
    CFBundleDisplayName: 舟知
win:
  target:
    - target: nsis
      arch: [x64]
  icon: desktop/assets/icon.ico
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  shortcutName: 舟知
  installerLanguages: [zh_CN, en_US]
