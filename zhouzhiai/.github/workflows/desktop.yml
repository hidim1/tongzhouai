name: Build Zhouzhi desktop packages
on:
  workflow_dispatch:
jobs:
  package:
    strategy:
      matrix:
        include:
          - os: macos-15
            script: package:mac
            artifact: mac-arm64
          - os: windows-latest
            script: package:win
            artifact: win-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: zhouzhiai/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: zhouzhiai/app/package-lock.json
      - run: npm ci
      - run: node scripts/test-source.mjs
      - run: node scripts/init-empty-data.mjs
      - if: runner.os == 'macOS'
        run: brew install libredwg
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Zhouzhi-${{ matrix.artifact }}
          path: |
            zhouzhiai/app/release/*.dmg
            zhouzhiai/app/release/*.zip
            zhouzhiai/app/release/*.exe
            zhouzhiai/app/release/*.blockmap
# Build verification only. Native interactive login/installation/business acceptance
# still requires the separate checklist in zhouzhiai/app/DESKTOP-ACCEPTANCE.md.
# This file is an optional template inside the source folder, not an active
# repository workflow. It builds the full desktop variant, not member-client.
